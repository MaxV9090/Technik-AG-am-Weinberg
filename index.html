<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    header {
      padding: 100px 20px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background: white;
      color: #1e3c72;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background: #ddd;
    }

    section {
      padding: 60px 20px;
      background: white;
      color: #333;
    }

    footer {
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Willkommen 👋</h1>
    <p>Meine erste eigene Website</p>

    <a class="button" href="#">Mehr erfahren</a>
  </header>

  <section>
    <h2>Über mich</h2>

    <p>
      Hier kannst du später Texte, Bilder,
      Social Media Links oder Projekte einfügen.
    </p>
  </section>

  <footer>
    © 2025 Meine Website
  </footer>

</body>
</html>
