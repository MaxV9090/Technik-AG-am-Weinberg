  <script>

    /* PASSWORTSCHUTZ */

    const password = '2504';

    /* Seite erst verstecken, Abfrage kommt nach dem Laden */
    document.documentElement.style.visibility = 'hidden';

    window.addEventListener('load', function () {

      setTimeout(function () {

        const userInput = prompt('Bitte Passwort eingeben:');

        if (userInput !== password) {

          document.body.innerHTML =
            '<h2 class="denied">Zugriff verweigert</h2>';

        }

        document.documentElement.style.visibility = 'visible';

      }, 100);

    });


    /* SEITEN WECHSELN */

    function showPage(pageId) {

      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      document.querySelectorAll('nav a').forEach(link => {
        link.classList.remove('current');
      });

      document.getElementById(pageId).classList.add('active');
      document.getElementById('nav-' + pageId).classList.add('current');

      window.scrollTo({
        top: document.querySelector('main').offsetTop - 20,
        behavior: 'smooth'
      });

    }


    /* LICHT FOLGT DER MAUS */

    document.addEventListener('pointermove', function (e) {

      const page = document.querySelector('.page.active');

      if (!page) return;

      const rect = page.getBoundingClientRect();

      page.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      page.style.setProperty('--my', (e.clientY - rect.top) + 'px');

    });

  </script>
