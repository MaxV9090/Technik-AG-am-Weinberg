<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    nav {
      background: rgba(0,0,0,0.3);
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd700;
    }

    header {
      padding: 100px 20px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background: white;
      color: #1e3c72;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    section {
      padding: 60px 20px;
      background: white;
      color: #333;
    }

    footer {
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#">Startseite</a>

    <a href="https://youtube.com/" target="_blank">
      YouTube
    </a>

    <a href="https://instagram.com/" target="_blank">
      Instagram
    </a>

    <a href="https://tiktok.com/" target="_blank">
      TikTok
    </a>
  </nav>

  <header>
    <h1>Willkommen 👋</h1>

    <p>
      Das ist meine eigene Website
    </p>

    <a class="button" href="#">
      Mehr erfahren
    </a>
  </header>

  <section>
    <h2>Über mich</h2>

    <p>
      Hier kannst du später Bilder,
      Videos oder Infos über dich einfügen.
    </p>
  </section>

  <footer>
    © 2025 Meine Website
  </footer>

</body>
</html>
