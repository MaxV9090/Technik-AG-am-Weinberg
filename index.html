<!DOCTYPE html>
<html>
  <head>
    <title>Mein Musikprojekt</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }

      header {
        background-color: #333;
        color: white;
        padding: 20px;
        text-align: center;
      }

      nav {
        background-color: #555;
        padding: 15px;
        display: flex;
        gap: 20px;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      .page {
        display: none;
        padding: 40px;
      }

      .active {
        display: block;
      }

      a.download {
        color: #007BFF;
        text-decoration: none;
        font-weight: bold;
      }

      a.download:hover {
        text-decoration: underline;
      }

      .impressum-box {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 500px;
      }

    </style>
  </head>

  <body>

    <header>
      <h1>Trailer Projekt</h1>
    </header>

    <nav>
      <a href="#" onclick="showPage('personen')">Personen</a>
      <a href="#" onclick="showPage('dateien')">Dateien</a>
      <a href="#" onclick="showPage('drehbuch')">Drehbuch</a>
      <a href="#" onclick="showPage('impressum')">Impressum</a>
    </nav>

    <!-- PERSONEN -->
    <div id="personen" class="page active">
      <h2>Personen</h2>

      <ul>
        <li>Max</li>
        <li>Lisa</li>
        <li>Tom</li>
      </ul>
    </div>

    <!-- DATEIEN -->
    <div id="dateien" class="page">
      <h2>Dateien</h2>

      <ul>
        <li>
          <a class="download" href="klassenarbeit spanisch neu.docx">
            Word-Datei herunterladen
          </a>
        </li>
      </ul>
    </div>

    <!-- DREHBUCH -->
    <div id="drehbuch" class="page">
      <h2>Drehbuch</h2>

      <p>
        Hier könnt ihr euer Drehbuch hinschreiben.
      </p>
    </div>

    <!-- IMPRESSUM -->
    <div id="impressum" class="page">

      <div class="impressum-box">

        <h2>Impressum</h2>

        <p><strong>Name:</strong> Max Voge</p>

        <p><strong>Telefon:</strong> 017632609863</p>

        <p><strong>E-Mail:</strong> maxvoge26@icloud.com</p>

        <p><strong>Adresse:</strong> Schleusenweg 79</p>

      </div>

    </div>

    <script>

      // Passwortschutz
      const password = 'deinpasswort';
      const userInput = prompt('Bitte Passwort eingeben:');

      if (userInput !== password) {
        document.body.innerHTML =
          '<h2 style="text-align:center; margin-top:50px;">Zugriff verweigert</h2>';
      }

      // Seiten wechseln
      function showPage(pageId) {

        const pages = document.querySelectorAll('.page');

        pages.forEach(page => {
          page.classList.remove('active');
        });

        document.getElementById(pageId).classList.add('active');
      }

    </script>

  </body>
</html>
