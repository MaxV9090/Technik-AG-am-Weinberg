<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>Technik AG am Weinberg</title>

  <style>

    /* =========================
       FARBEN (hell / dunkel automatisch)
       ========================= */

    :root {
      --bg: #e6e6e6;
      --grid: rgba(0, 0, 0, 0.05);
      --card: #ffffff;
      --card-2: #f2f2f2;
      --text: #0d0d0d;
      --muted: #666666;
      --line: #cdcdcd;
      --strong: #0d0d0d;
      --on-strong: #ffffff;
      --glow: rgba(0, 0, 0, 0.07);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --grid: rgba(255, 255, 255, 0.035);
        --card: #141414;
        --card-2: #1c1c1c;
        --text: #f2f2f2;
        --muted: #8a8a8a;
        --line: #2b2b2b;
        --strong: #f2f2f2;
        --on-strong: #0a0a0a;
        --glow: rgba(255, 255, 255, 0.08);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      }
    }


    /* =========================
       GRUNDLAYOUT
       ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      background-attachment: fixed;
    }


    /* =========================
       KOPFBEREICH = BÜHNE
       (immer dunkel, egal welcher Modus)
       ========================= */

    .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;

      min-height: min(80vh, 660px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      padding: 0 20px 56px;
      background:
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 255, 255, 0.10), transparent 70%),
        #050505;
      color: #ffffff;
    }

    /* Übergang in die Seite */
    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 140px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      z-index: 1;
      pointer-events: none;
    }

    /* Traverse oben */
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(#2a2a2a, #0d0d0d);
      border-bottom: 1px solid #3a3a3a;
      z-index: 2;
    }


    /* Scheinwerfer */

    .beam {
      position: absolute;
      top: 8px;
      left: var(--x);
      width: 0;
      height: 100%;
      transform-origin: 0 0;
      transform: rotate(var(--a));
      animation: sweep var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .beam::before {
      content: "";
      position: absolute;
      top: 0;
      left: -130px;
      width: 260px;
      height: 120%;
      clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.60),
        rgba(255, 255, 255, 0.10) 65%,
        transparent
      );
      filter: blur(5px);
    }

    .beam::after {
      content: "";
      position: absolute;
      top: -9px;
      left: -10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 26px 10px rgba(255, 255, 255, 0.55);
    }

    @keyframes sweep {
      from { transform: rotate(var(--a)); }
      to   { transform: rotate(var(--b)); }
    }


    /* Titel */

    .hero-inner {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 38px;
    }

    .hero h1 {
      margin: 0;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .hero h1 span {
      display: block;
    }

    .l1 {
      font-size: clamp(54px, 13vw, 150px);
      color: #ffffff;
      text-shadow: 0 0 60px rgba(255, 255, 255, 0.25);
    }

    .l2 {
      font-size: clamp(40px, 10vw, 112px);
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.9);
    }


    /* =========================
       NAVIGATION = MISCHPULT
       ========================= */

    nav {
      position: relative;
      z-index: 2;

      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;

      padding: 6px;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    nav a {
      display: flex;
      align-items: center;
      gap: 10px;

      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;

      padding: 12px 20px;
      border-radius: 9px;
      border: 1px solid transparent;
      transition: background-color 0.2s, color 0.2s;
    }

    nav a::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #3a3a3a;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    nav a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.07);
    }

    nav a.current {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
    }

    nav a.current::before {
      background-color: #ffffff;
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
    }

    a:focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 3px;
    }


    /* =========================
       INHALTSBEREICH
       ========================= */

    main {
      flex: 1;
      padding: 20px 20px 80px;
    }


    /* =========================
       SEITEN
       ========================= */

    .page {
      display: none;
      position: relative;
      overflow: hidden;

      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);

      padding: 40px;
      margin: 0 auto;

      width: 100%;
      max-width: 720px;
      min-height: 340px;
    }

    .page > * {
      position: relative;
    }

    /* Licht folgt der Maus */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 60%);
      pointer-events: none;
    }

    .active {
      display: block;
      animation: einblenden 0.4s ease;
    }

    @keyframes einblenden {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .page h2 {
      margin: 0 0 30px;
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .page h2::after {
      content: "";
      display: block;
      width: 48px;
      height: 4px;
      margin-top: 16px;
      background-color: var(--strong);
      border-radius: 2px;
    }

    .page ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }


    /* =========================
       VERANSTALTUNGEN
